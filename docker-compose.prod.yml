# Production stack for a single DigitalOcean droplet (all-in-one).
# Only nginx is published to the host (ports 80/443). Everything else talks over
# the internal `constructiq` network by service name.
#
# App images are built by CI (.github/workflows/deploy.yml) and pulled from
# GHCR — set IMAGE_TAG to pin a build (defaults to `latest`):
#
#   IMAGE_TAG=sha-abc1234 docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d
#
# The manual build-on-droplet path still works by adding --build. One-off jobs:
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod --profile init up minio-init
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod --profile seed run --rm backend-seed
#
# See docs/DEPLOYMENT.md for the full runbook.

services:
  mongo:
    image: mongo:7
    container_name: constructiq_mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo_data:/data/db
    # Self-initialising single-node replica set: the first healthcheck tick
    # runs rs.initiate() (rs.status() throws until then); subsequent ticks pass.
    healthcheck:
      test: >
        echo "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok
        }" | mongosh --quiet | grep -q 1
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 5s
    networks:
      - constructiq

  redis:
    image: redis:7-alpine
    container_name: constructiq_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - constructiq

  minio:
    image: minio/minio:latest
    container_name: constructiq_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - constructiq

  # One-off: create the bucket + allow anonymous downloads (so the browser can
  # GET uploaded files through nginx /storage/). Run with `--profile init`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/"${S3_BUCKET}" &&
        mc anonymous set download local/"${S3_BUCKET}" &&
        echo "bucket ${S3_BUCKET} ready"
    profiles: ['init']
    networks:
      - constructiq

  backend:
    image: ghcr.io/alisleiman0/construct-iq/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: runtime
    container_name: constructiq_backend
    restart: unless-stopped
    env_file:
      - ./deploy/.env.prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - constructiq

  frontend:
    image: ghcr.io/alisleiman0/construct-iq/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000}
    container_name: constructiq_frontend
    restart: unless-stopped
    environment:
      # Read at runtime by the standalone server (SSR fetch + next.config
      # rewrite). Build-stage ENV does not carry into the runtime stage.
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000}
    depends_on:
      - backend
    networks:
      - constructiq

  # One-off first-boot seeding (super admin + roles + demo data). Uses the
  # `build` image target, which carries ts-node + scripts/. Run with
  # `--profile seed run --rm backend-seed`.
  backend-seed:
    image: ghcr.io/alisleiman0/construct-iq/backend-seed:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: build
    env_file:
      - ./deploy/.env.prod
    command:
      ['sh', '-c', 'npm run seed && npm run seed:site-eng && npm run seed:surveyor']
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ['seed']
    networks:
      - constructiq

  nginx:
    image: nginx:alpine
    container_name: constructiq_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/constructiq.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certs live on the host (issued/renewed by host certbot).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for ACME http-01 renewals (certbot -w /opt/constructiq/certbot-www).
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - constructiq

volumes:
  mongo_data:
  redis_data:
  minio_data:

networks:
  constructiq:
    driver: bridge
