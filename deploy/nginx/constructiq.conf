# ConstructIQ reverse proxy (HTTP). Makes the app + API same-origin so auth
# cookies are SameSite=Lax. TLS server block is templated at the bottom.

server {
    listen 80;
    server_name _;

    # Uploads pass through /api/v1/documents; allow reasonably large bodies.
    client_max_body_size 25m;

    # API → NestJS backend. trust-proxy is on in the backend, so the
    # X-Forwarded-For below drives req.ip for the IP allowlist.
    location /api/v1/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files → MinIO. Trailing slash on proxy_pass strips the /storage/
    # prefix, so /storage/<bucket>/<key> → minio:9000/<bucket>/<key> (path-style).
    # The bucket has an anonymous download policy (set by minio-init).
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js standalone server.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# =============================================================================
