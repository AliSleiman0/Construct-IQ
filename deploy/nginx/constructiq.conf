# ConstructIQ reverse proxy — constructiq.site (TLS via Let's Encrypt).
# App + API are same-origin so auth cookies stay SameSite=Lax.
#
# Certs are issued/renewed by certbot ON THE HOST and mounted read-only at
# /etc/letsencrypt (see docker-compose.prod.yml). Renewals use the webroot
# below (/.well-known/acme-challenge/), so nginx never has to stop.

# :80 — ACME challenges only; everything else redirects to HTTPS.
server {
    listen 80 default_server;
    server_name constructiq.site www.constructiq.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://constructiq.site$request_uri;
    }
}

# :443 www → apex canonicalization.
server {
    listen 443 ssl;
    http2 on;
    server_name www.constructiq.site;

    ssl_certificate     /etc/letsencrypt/live/constructiq.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/constructiq.site/privkey.pem;

    return 301 https://constructiq.site$request_uri;
}

# :443 — the app.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name constructiq.site;

    ssl_certificate     /etc/letsencrypt/live/constructiq.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/constructiq.site/privkey.pem;

    # Uploads pass through /api/v1/documents; allow reasonably large bodies.
    client_max_body_size 25m;

    # API → NestJS backend. trust-proxy is on in the backend, so the
    # X-Forwarded-For below drives req.ip for the IP allowlist.
    location /api/v1/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files → MinIO. Trailing slash on proxy_pass strips the /storage/
    # prefix, so /storage/<bucket>/<key> → minio:9000/<bucket>/<key> (path-style).
    # The bucket has an anonymous download policy (set by minio-init).
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js standalone server.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
